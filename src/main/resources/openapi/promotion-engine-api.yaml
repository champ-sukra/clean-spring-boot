openapi: 3.0.3
info:
  title: Promotion Engine API (Minimal)
  description: Minimal OpenAPI covering only the two provided tasks
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local
security:
  - bearerAuth: []

paths:
  /promotion-rules:
    get:
      tags: [promotionRules]
      summary: List promotion rules
      description: Retrieve a paginated list of promotion rules with optional filters.
      operationId: listPromotionRules
      parameters:
        - in: query
          name: status
          description: Numeric status code (1=PENDING, 2=ACTIVE, 3=EXPIRED)
          required: false
          schema:
            type: integer
            enum: [1, 2, 3]
        - in: query
          name: templateId
          required: false
          schema:
            type: integer
            format: int64
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './components/schemas/PagedPromotionRuleResponse.yaml'
              examples:
                sample:
                  value:
                    code: success
                    data:
                      items:
                        - id: 10
                          template_id: 5
                          rule_name: "Flash Sale"
                          start_date: "2025-01-01T00:00:00Z"
                          end_date: "2025-01-07T23:59:59Z"
                          status: 2
                          priority: 0
                          quota: { type: "LIMIT", value: 100 }
                          quota_used: 12
                          created_at: "2025-01-01T00:00:00Z"
                          updated_at: "2025-01-02T00:00:00Z"
                      total: 1
                      page: 1
                      size: 20
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: './components/schemas/ErrorResponse.yaml'
              examples:
                invalidStatus:
                  value:
                    code: invalid_request
                    message: Invalid status value
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: './components/schemas/ErrorResponse.yaml'

  /promotion-rules/{id}:
    get:
      tags: [promotionRule]
      summary: Get promotion rule by ID
      description: Retrieve a promotion rule including conditions, actions, and stacking
      operationId: getPromotionRuleById
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './components/schemas/PromotionRuleDetailEnvelope.yaml'
        '400':
          description: Not found
          content:
            application/json:
              schema:
                $ref: './components/schemas/ErrorResponse.yaml'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: './components/schemas/ErrorResponse.yaml'

  /promotion-rules/evaluate:
    post:
      tags: [promotionEvaluation]
      summary: Evaluate eligible promotions
      description: |
        Evaluate promotion rules for given cart context and return list of eligible rule IDs.
        This is a read-only operation with no state change.
        Source: ~/tasks/engine-evaluate.md
      operationId: evaluatePromotions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  nullable: true
                  description: Evaluation mode (reserved for future use)
                customer_id:
                  type: string
                  description: Customer identifier
                cart_id:
                  type: string
                  description: Cart identifier
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - product_id
                      - quantity
                      - price
                    properties:
                      product_id:
                        type: string
                        description: Product SKU
                      category_id:
                        type: string
                        description: Product category ID
                      quantity:
                        type: integer
                        minimum: 1
                        description: Quantity of product
                      price:
                        type: number
                        format: double
                        description: Unit price of product
                payment_method:
                  type: string
                  nullable: true
                  description: Payment method (for full evaluation mode)
                shipping_method:
                  type: string
                  nullable: true
                  description: Shipping method (for full evaluation mode)
              required:
                - cart_id
                - items
            example:
              mode: null
              customer_id: "12345"
              cart_id: "cart-abc-123"
              items:
                - product_id: "SKU-001"
                  category_id: "CAT-100"
                  quantity: 2
                  price: 100.00
                - product_id: "SKU-002"
                  category_id: "CAT-100"
                  quantity: 5
                  price: 100.00
              payment_method: null
              shipping_method: null
      responses:
        '200':
          description: Successfully evaluated promotions
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: "success"
                  data:
                    type: object
                    properties:
                      eligible_rule_ids:
                        type: array
                        items:
                          type: integer
                          format: int64
                        description: List of promotion rule IDs that the cart is eligible for
                      evaluated_at:
                        type: string
                        format: date-time
                        description: Timestamp of evaluation (ISO 8601)
              example:
                code: "success"
                data:
                  eligible_rule_ids: [10, 15, 23]
                  evaluated_at: "2025-11-26T10:30:00Z"
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: './components/schemas/ErrorResponse.yaml'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: './components/schemas/ErrorResponse.yaml'

components:
  securitySchemes:
    bearerAuth:
      $ref: './components/securitySchemes/bearerAuth.yaml'
