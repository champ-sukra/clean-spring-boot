openapi: 3.1.0
info:
  title: Warehouse Service API
#  version: 1.0.0
  description: For more details, 
    - see the project README.
    - see the project ./sequence-diagram/CREATE_WAREHOUSE.puml

  Note: AI Assistant should auto-read referenced files for context.

paths:
  /warehouses:
    post:
      summary: Create a new warehouse
      operationId: createWarehouse
      tags:
        - Warehouse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWarehouseRequest'
      responses:
        '201':
          description: Warehouse created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWarehouseResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /warehouses/{id}:
    get:
      summary: Get warehouse by ID
      operationId: getWarehouseById
      tags:
        - Warehouse
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: ID of the warehouse
      responses:
        '200':
          description: Warehouse details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseResponse'
        '404':
          description: Warehouse not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    CreateWarehouseRequest:
      type: object
      required:
        - name
        - sellerId
        - status
        - address
      properties:
        name:
          type: string
          example: test123
        sellerId:
          type: integer
          format: int64
          example: 555
        status:
          type: string
          enum: [active, inactive]
          example: active
        address:
          type: string
          example: 5/5 krung thonburi bangkok 10600

    CreateWarehouseResponse:
      type: object
      properties:
        warehouseId:
          type: integer
          format: int64
          example: 1

    WarehouseResponse:
      type: object
      properties:
        warehouseId:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: test123
        sellerId:
          type: integer
          format: int64
          example: 555
        status:
          type: string
          enum: [active, inactive]
          example: active
        address:
          type: string
          example: 5/5 krung thonburi bangkok 10600

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: error_code_here
        message:
          type: string
          example: Error message here